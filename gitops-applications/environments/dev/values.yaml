# 微服务开发环境部署配置
image:
  repository: harbor.demo.example.com/example/camp-go-example
  tag: dev-latest
  pullPolicy: Always

replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

ingress:
  enabled: true
  className: gitlab-nginx
  hosts:
    - host: dev.podinfo.local
      paths:
        - path: /
          pathType: Prefix
